<!doctype html>
<html lang="en" class="embed">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Access Panel Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<meta name="robots" content="noindex">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:inherit}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: a workbench. Header, then the isometric floor (stage) beside an inspector card, a trace strip under it,
   then the calendar plug: CSV input on the left, the week-by-platform report on the right. */
:root{
  --ground:#e3e7e1; --stage:#e9ece7; --surface:#f6f8f4; --fg:#18201b; --muted:#536059; --rule:#c4ccc5;
  --hazard:#f2b705; --accent-ink:#8a5f00; --glow:rgba(242,183,5,.75);
  --go:#2f9e57; --part:#e0a100; --stop:#d2483a; --unk:#7d887f;
  --go-bg:#dcefe2; --part-bg:#f8ebc9; --stop-bg:#f6dcd8; --unk-bg:#e6e9e5;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif; --f-body:'IBM Plex Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  /* object materials: the objects keep their own paint in both themes */
  --edge:#1f2622; --obj-ink:#1b211d;
  --steel-t:#c9d1cb;--steel-l:#a9b3ac;--steel-r:#8b958e;--paper-t:#f7f5ee;--paper-l:#dedbd0;--paper-r:#c8c4b7;
  --cobalt-t:#3f63a8;--cobalt-l:#2f4d86;--cobalt-r:#253d6b;--olive-t:#8e9a6a;--olive-l:#727d52;--olive-r:#5d6643;
  --wood-t:#c49a6c;--wood-l:#a77e52;--wood-r:#8a6640;--slate-t:#4a524d;--slate-l:#363c38;--slate-r:#2a2f2c;
  --amber-t:#f2b705;--amber-l:#cf9a00;--amber-r:#a87d00;--sage-t:#b9c5b2;--sage-l:#aab7a3;--sage-r:#8d9a87;
  --plum-t:#3a2d48;--plum-l:#2a1f33;--plum-r:#1f1726;--kraft-t:#d9bf8f;--kraft-l:#c2a674;--kraft-r:#a68b5d;
  --base-t:#d3dad3;--base-l:#b7c0b8;--base-r:#9fa9a1;--zone-t:#c6cfc7;--zone-edge:#8d998f;--zone-ink:#5b675e;--tb-t:#dbe1db;--tb-s:#aeb8b0;
  --pipe:#9fb0a3;--tag-bg:#f6f8f4;--tag-line:#6f7b72;--tag-fg:#18201b;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#121613;--stage:#171c18;--surface:#1c221e;--fg:#e4e9e3;--muted:#9aa69e;--rule:#2f3832;
  --accent-ink:#f2b705;--glow:rgba(242,183,5,.6);
  --go:#57dd87;--part:#ffc53d;--stop:#f0705f;--unk:#8d988f;
  --go-bg:#1d3326;--part-bg:#3a3018;--stop-bg:#3d201c;--unk-bg:#232a25;
  --base-t:#2a322c;--base-l:#1f2521;--base-r:#171c19;--zone-t:#313a33;--zone-edge:#4f5c53;--zone-ink:#8d998f;--tb-t:#273029;--tb-s:#1a201c;
  --pipe:#6f8174;--tag-bg:#1c221e;--tag-line:#7d887f;--tag-fg:#e4e9e3;color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#121613;--stage:#171c18;--surface:#1c221e;--fg:#e4e9e3;--muted:#9aa69e;--rule:#2f3832;
  --accent-ink:#f2b705;--glow:rgba(242,183,5,.6);
  --go:#57dd87;--part:#ffc53d;--stop:#f0705f;--unk:#8d988f;
  --go-bg:#1d3326;--part-bg:#3a3018;--stop-bg:#3d201c;--unk-bg:#232a25;
  --base-t:#2a322c;--base-l:#1f2521;--base-r:#171c19;--zone-t:#313a33;--zone-edge:#4f5c53;--zone-ink:#8d998f;--tb-t:#273029;--tb-s:#1a201c;
  --pipe:#6f8174;--tag-bg:#1c221e;--tag-line:#7d887f;--tag-fg:#e4e9e3;color-scheme:dark}
body{background:var(--ground);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 64px;display:flex;flex-direction:column;gap:40px}
header{display:flex;flex-direction:column;gap:12px;max-width:860px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(38px,6vw,64px);line-height:.95;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.05em;text-transform:uppercase}
.lede{margin:0;font-size:17px;color:var(--muted);max-width:66ch}
.datanote{margin:0;font-size:13px;color:var(--muted)}
.datanote b{font-weight:600;color:var(--fg)}
.bench{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.stagecol{display:flex;flex-direction:column;gap:12px;min-width:0}
.stage{position:relative;border-radius:6px;background:var(--stage);border:1px solid var(--rule);overflow:hidden;outline:none}
.stage:focus-visible{box-shadow:0 0 0 3px var(--hazard)}
.stage svg{display:block;width:100%;height:680px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.stage svg.dragging{cursor:grabbing}
.tools{position:absolute;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tb{appearance:none;border:1px solid var(--rule);background:var(--surface);color:var(--fg);font:600 13px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;min-width:36px;min-height:36px;padding:0 10px;border-radius:4px;cursor:pointer}
.tb:hover{border-color:var(--muted)}.tb:focus-visible,.btn:focus-visible,.plist button:focus-visible,textarea:focus-visible{outline:3px solid var(--hazard);outline-offset:2px}
.tb[aria-pressed="true"]{background:var(--fg);color:var(--ground);border-color:var(--fg)}
.tb.sym{font-family:var(--f-mono);font-size:17px;padding:0}
.hint{position:absolute;left:10px;bottom:10px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:4px 8px;pointer-events:none}
.zoom{position:absolute;left:10px;top:10px;font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:4px 8px;font-variant-numeric:tabular-nums;pointer-events:none}
/* trace strip */
.trace{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px 14px}
.trace .count{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.trace .count b{display:block;font-family:var(--f-mono);font-size:22px;letter-spacing:0;font-variant-numeric:tabular-nums}
.trace p{margin:0;min-width:0}
.trace .ctl{display:flex;gap:6px}
.btn{appearance:none;border:1px solid var(--fg);background:var(--fg);color:var(--ground);font:600 14px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;min-height:40px;padding:0 14px;border-radius:4px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--rule)}
.btn:disabled{opacity:.4;cursor:default}
/* inspector */
.inspector{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.layerchip{align-self:flex-start;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:3px;background:var(--fg);color:var(--ground)}
.card h3{font-size:24px;line-height:1.05}
.kv{display:flex;flex-direction:column;gap:2px}
.kv dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:0;font-size:14.5px}
dl.kvs{margin:0;display:flex;flex-direction:column;gap:10px}
.limit{font-size:14px;border-top:1px dashed var(--rule);padding-top:10px;color:var(--muted)}
.limit b{color:var(--fg);font-weight:600}
.plist{display:flex;flex-direction:column;gap:10px}
.plist .grp{display:flex;flex-direction:column;gap:4px}
.plist .gname{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.plist .row{display:flex;flex-wrap:wrap;gap:4px}
.plist button{appearance:none;border:1px solid var(--rule);background:transparent;color:var(--fg);font:500 13px/1.2 var(--f-body);padding:6px 9px;border-radius:3px;cursor:pointer;min-height:32px}
.plist button[aria-pressed="true"]{background:var(--hazard);border-color:var(--hazard);color:#161a17}
.plist button:hover{border-color:var(--muted)}
/* scene states */
.scene .part,.scene .pipe,.scene .tag{transition:opacity .25s}
.scene.has-sel .part:not(.sel),.scene.has-sel .tag:not(.sel){opacity:.32}
.scene.has-sel .pipe:not(.active){opacity:.45}
.scene .part{cursor:pointer}
.scene .part.sel{filter:drop-shadow(0 0 5px var(--glow))}
.scene .tag{cursor:pointer}
.scene .tag.sel .tagBg{fill:var(--hazard);stroke:#161a17}
.scene .tag.sel .tagText{fill:#161a17}
.scene .pipe.active .pipeI{stroke:var(--hazard)}
.scene.no-tags .tag{display:none}
@media (max-width:980px){.bench{grid-template-columns:minmax(0,1fr)}.inspector{position:static}}
@media (max-width:640px){.stage svg{height:460px}.trace{grid-template-columns:minmax(0,1fr)}.hint{display:none}}
@media (prefers-reduced-motion:reduce){.scene .part,.scene .pipe,.scene .tag{transition:none}}
.ovLead{margin:0;font-size:15.5px;line-height:1.45}
ul.why{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.cardtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.backov{appearance:none;border:1px solid var(--rule);background:transparent;color:var(--fg);font:600 12px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;min-height:32px;padding:0 10px;border-radius:3px;cursor:pointer}
.backov:hover{border-color:var(--muted)}.backov:focus-visible{outline:3px solid var(--hazard);outline-offset:2px}
.camrow{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:10px 12px}
.seg{display:inline-flex;gap:0}.seg .tb{border-radius:0}.seg .tb:first-child{border-radius:4px 0 0 4px}.seg .tb:last-child{border-radius:0 4px 4px 0;margin-left:-1px}
.slider{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;flex:1 1 180px;min-width:0}
.slider input{flex:1;min-width:80px;accent-color:var(--accent-ink);height:28px}
.slider output{font-family:var(--f-mono);font-size:12.5px;letter-spacing:0;width:44px;text-align:right;font-variant-numeric:tabular-nums}
.slider input:focus-visible{outline:3px solid var(--hazard);outline-offset:2px}
.scene polygon{stroke:var(--edge);stroke-width:.9;stroke-linejoin:round}
.scene text{font-family:var(--f-display);font-weight:600;letter-spacing:.06em}
.scene text.mono{font-family:var(--f-mono);font-weight:500;letter-spacing:0}
.scene text.b{font-weight:700}
.m-steel .ft{fill:var(--steel-t)}.m-steel .fl{fill:var(--steel-l)}.m-steel .fr{fill:var(--steel-r)}
.m-paper .ft{fill:var(--paper-t)}.m-paper .fl{fill:var(--paper-l)}.m-paper .fr{fill:var(--paper-r)}
.m-cobalt .ft{fill:var(--cobalt-t)}.m-cobalt .fl{fill:var(--cobalt-l)}.m-cobalt .fr{fill:var(--cobalt-r)}
.m-olive .ft{fill:var(--olive-t)}.m-olive .fl{fill:var(--olive-l)}.m-olive .fr{fill:var(--olive-r)}
.m-wood .ft{fill:var(--wood-t)}.m-wood .fl{fill:var(--wood-l)}.m-wood .fr{fill:var(--wood-r)}
.m-slate .ft{fill:var(--slate-t)}.m-slate .fl{fill:var(--slate-l)}.m-slate .fr{fill:var(--slate-r)}
.m-amber .ft{fill:var(--amber-t)}.m-amber .fl{fill:var(--amber-l)}.m-amber .fr{fill:var(--amber-r)}
.m-sage .ft{fill:var(--sage-t)}.m-sage .fl{fill:var(--sage-l)}.m-sage .fr{fill:var(--sage-r)}
.m-plum .ft{fill:var(--plum-t)}.m-plum .fl{fill:var(--plum-l)}.m-plum .fr{fill:var(--plum-r)}
.m-kraft .ft{fill:var(--kraft-t)}.m-kraft .fl{fill:var(--kraft-l)}.m-kraft .fr{fill:var(--kraft-r)}
.m-base .ft{fill:var(--base-t)}.m-base .fl{fill:var(--base-l)}.m-base .fr{fill:var(--base-r)}
.m-zone .ft{fill:var(--zone-t)}.m-zone .fl,.m-zone .fr{fill:var(--zone-t)}
.m-zone polygon{stroke:var(--zone-edge);stroke-width:1.2;stroke-dasharray:6 5}
.ink{fill:var(--obj-ink)}
.onblue{fill:#f2f4ef}.onDark{fill:#ece7d8}.gold{fill:#ffd66b}
.rule{fill:var(--obj-ink);opacity:.45}.ruleL{fill:#f2f4ef;opacity:.6}
.screen{fill:#08100c;stroke:#2a312c;stroke-width:.8}
.scrInk{fill:#c9fbe8}.scrDim{fill:#7fbfa4}.scrStop{fill:#ff8a7d}
.scrBar{fill:#2a3a33}.scrCard{fill:#e8ece6}.scrField{fill:#c3cbc5}.scrBtn{fill:#2f7a3f}
.dial{fill:#f7f5ee;stroke:var(--edge);stroke-width:1}
.tick,.hand{stroke:var(--obj-ink);stroke-width:1.1;stroke-linecap:round}.hand{stroke-width:1.6}
.btnRed{fill:#c63b2e;stroke:var(--edge);stroke-width:.8}
.slot{fill:#101411}
.ledGo{fill:#57dd87;stroke:var(--edge);stroke-width:.8}.ledOff{fill:#3a413c;stroke:var(--edge);stroke-width:.8}
.lensO{fill:#2a2f2c;stroke:var(--edge);stroke-width:1}.lensI{fill:#3d6f8f}.glint{fill:#e8f4ff;opacity:.85}
.arc{fill:none;stroke:var(--obj-ink);stroke-width:1.4}.needle{stroke:#c63b2e;stroke-width:1.4;stroke-linecap:round}.pivot{fill:var(--obj-ink)}
.drawer{fill:#97a276;stroke:var(--edge);stroke-width:.8}.handle{fill:#2a2f2c}
.labelPlate{fill:#f7f5ee;stroke:var(--edge);stroke-width:.5}
.plateDark{fill:#161a17}
.screw{fill:#dde3d9;stroke:#586156;stroke-width:.5}
.btnRing{fill:#1a1e1b}.btnTest{fill:#e9e9e2}.btnAck{fill:#f0a818}
.colPlate{fill:#ece7d8;stroke:var(--edge);stroke-width:.4}
.lamp{stroke:#0f1310;stroke-width:.5}
.l-go{fill:var(--go)}.l-part{fill:var(--part)}.l-stop{fill:var(--stop)}.l-unk{fill:#1c201d;stroke:#9aa396;stroke-dasharray:1.2 .9}
.bulb{fill:#ffd66b}.insert{fill:#221a2c;stroke:#4a3a56;stroke-width:.4}
.calCol{fill:#eef0ea;stroke:#c8c4b7;stroke-width:.4}
.card{stroke:var(--edge);stroke-width:.35}
.card-li{fill:#9fc3e6}.card-rd{fill:#f4b391}.card-yt{fill:#f19a94}.card-x{fill:#c7cbc8}.card-ig{fill:#e2b0d3}.card-fb{fill:#a9b8ef}
.zoneLabel{fill:var(--zone-ink);font-weight:700!important;letter-spacing:.22em!important}
.pipeO{fill:none;stroke:var(--edge);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.pipeI{fill:none;stroke:var(--pipe);stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round}
.pulse{fill:var(--hazard);stroke:var(--edge);stroke-width:1}
.tagStem{stroke:var(--tag-line);stroke-width:1}
.tagBg{fill:var(--tag-bg);stroke:var(--tag-line);stroke-width:1}
.tagText{fill:var(--tag-fg);font-size:10.5px;font-weight:700!important;letter-spacing:.08em!important}
.tagDot{fill:var(--tag-line)}
.m-tb .ft{fill:var(--tb-t)}.m-tb .fl,.m-tb .fr{fill:var(--tb-s)}
.tbFrame{fill:none;stroke:var(--zone-ink);stroke-width:1.2}.tbLine{stroke:var(--zone-ink);stroke-width:1}
.tbZone{fill:var(--zone-t);stroke:var(--zone-edge);stroke-width:1.2;stroke-dasharray:6 5}
.tbText{fill:var(--zone-ink);letter-spacing:.14em!important}
.vent{fill:none;stroke:var(--edge);stroke-width:.8;opacity:.6}


html.embed,html.embed body{height:100%}
html.embed body{overflow:hidden}
html.embed .wrap{max-width:none;height:100%;box-sizing:border-box;padding-block:12px;gap:0}
html.embed .bench{height:100%;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:stretch}
html.embed .stagecol{min-height:0;gap:10px}
html.embed .stage{flex:1;min-height:0}
html.embed .stage svg{height:100%;min-height:300px}
html.embed .inspector{position:static;overflow:auto;min-height:0;max-height:100%}
html.embed .camrow{padding:8px 10px}
html.embed .trace{padding:8px 12px}
@media (max-width:760px){
  html.embed,html.embed body{height:auto}
  html.embed body{overflow:auto}
  html.embed .bench{height:auto;grid-template-columns:minmax(0,1fr)}
  html.embed .stage{flex:none}
  html.embed .stage svg{height:420px}
  html.embed .inspector{max-height:none}
}
</style>
</head>
<body>


<div class="wrap">

  <section class="bench" aria-label="Isometric teardown">
    <div class="stagecol">
      <div class="stage" id="stage" tabindex="0" aria-label="Isometric scene. Use plus and minus to zoom, arrow keys to move, square brackets to turn, or pick a part from the list.">
        <svg id="scene" class="scene" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Isometric teardown of the AI access panel: sources, checks, records, the panel, and the calendar plug" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="zoom" id="zoomRead">100%</div>
        <div class="tools">
          <button class="tb sym" id="zOut" type="button" aria-label="Zoom out">−</button>
          <button class="tb sym" id="zIn" type="button" aria-label="Zoom in">+</button>
          <button class="tb" id="zFit" type="button">Fit</button>
          <button class="tb" id="tLabels" type="button" aria-pressed="true">Labels</button>
          <button class="tb" id="tFlow" type="button" aria-pressed="true">Flow</button>
        </div>
        <div class="hint" id="hintText">Drag to turn and tilt · scroll or pinch to zoom · click a part</div>
      </div>
      <div class="camrow" role="group" aria-label="View controls">
        <div class="seg" role="group" aria-label="Dragging the room">
          <button class="tb" id="modeRotate" type="button" aria-pressed="true">Rotate</button>
          <button class="tb" id="modeMove" type="button" aria-pressed="false">Move</button>
        </div>
        <label class="slider" for="turn"><span>Turn</span><input id="turn" type="range" min="-180" max="180" step="1" value="-28"><output id="turnOut">-28°</output></label>
        <label class="slider" for="tilt"><span>Tilt</span><input id="tilt" type="range" min="15" max="75" step="1" value="30"><output id="tiltOut">30°</output></label>
        <button class="tb" id="resetView" type="button">Reset view</button>
      </div>
      <div class="trace" id="trace">
        <div class="count">Trace one light<b id="stepNum">0 / 9</b></div>
        <p id="stepText">Follow LinkedIn's GPTBot light from its robots.txt file to the calendar report, one step at a time.</p>
        <div class="ctl">
          <button class="btn ghost" id="stepPrev" type="button" disabled>Back</button>
          <button class="btn" id="stepNext" type="button">Start</button>
        </div>
      </div>
      <p class="datanote"><b>Note:</b> the lamp states shown are sample data, not live checks.</p>
    </div>
    <aside class="inspector">
      <div class="card" id="info" aria-live="polite"></div>
      <div class="card">
        <h3>Parts</h3>
        <div class="plist" id="plist"></div>
      </div>
    </aside>
  </section>

</div>

<script>
/* AI access panel room: a rotatable orthographic drawing.
   World: x and y on the floor, z up. The camera turns around z (az) and looks down at an angle (el).
   buildScene() returns an SVG string for the current camera, so it can run in Node for checks. */

var CAM = { az: -28, el: 30 };
var DEFAULT_VIEW = { az: -28, el: 30 };
var _ca, _sa, _ce, _se;
function setCamera(az, el) {
  CAM.az = ((az % 360) + 360) % 360; CAM.el = Math.max(12, Math.min(80, el));
  var a = CAM.az * Math.PI / 180, e = CAM.el * Math.PI / 180;

  function curAz() { return CAM.az > 180 ? CAM.az - 360 : CAM.az; }
  function syncControls() {
    var a = Math.round(curAz()), t = Math.round(CAM.el);
    turnEl.value = a; tiltEl.value = t;
    turnOut.textContent = a + '°'; tiltOut.textContent = t + '°';
  }
  function turnTo(az, el) {
    pendingCam = { az: az, el: Math.max(15, Math.min(75, el)) };
    if (!camRaf) { camRaf = requestAnimationFrame(applyCam); }
  }
  function applyCam() {
    camRaf = null;
    if (!pendingCam) { return; }
    var c = pendingCam; pendingCam = null;
    var zf = BASE.w / vb.w;
    var mid = unproject(vb.x + vb.w / 2, vb.y + vb.h / 2, 40);
    setCamera(c.az, c.el);
    svg.innerHTML = buildScene();
    pulseG = svg.querySelector('.pulses');
    tracks = buildTracks();
    BASE = sceneBounds();
    if (fitted) { vb = { x: BASE.x, y: BASE.y, w: BASE.w, h: BASE.h }; }
    else {
      var q = P(mid[0], mid[1], 40), w = BASE.w / zf, h = BASE.h / zf;
      vb = { x: q[0] - w / 2, y: q[1] - h / 2, w: w, h: h };
    }
    applyVB();
    mark(lastMark.ids, lastMark.pipes);
    syncControls();
  }
  turnEl.addEventListener('input', function () { turnTo(+turnEl.value, CAM.el); });
  tiltEl.addEventListener('input', function () { turnTo(curAz(), +tiltEl.value); });
  document.getElementById('resetView').addEventListener('click', function () { fitted = true; turnTo(DEFAULT_VIEW.az, DEFAULT_VIEW.el); });
  var modeBtns = [document.getElementById('modeRotate'), document.getElementById('modeMove')];
  modeBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      dragMode = b.id === 'modeRotate' ? 'rotate' : 'move';
      modeBtns.forEach(function (o) { o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); });
      document.getElementById('hintText').textContent = hintFor(dragMode);
    });
  });

  /* ---------- selection and inspector ---------- */
  var info = document.getElementById('info');
  var plist = document.getElementById('plist');
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  LAYERS.forEach(function (L) {
    var g = document.createElement('div'); g.className = 'grp';
    var n = document.createElement('div'); n.className = 'gname'; n.textContent = L; g.appendChild(n);
    var row = document.createElement('div'); row.className = 'row';
    PARTS.filter(function (p) { return p.layer === L; }).forEach(function (p) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = p.name; b.setAttribute('data-pick', p.id); b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function () { stopTrace(); select(p.id, true); });
      row.appendChild(b);
    });
    g.appendChild(row); plist.appendChild(g);
  });
  function overview() {
    var h = '<span class="layerchip">Overview</span><h3>What you\'re looking at</h3>' +
      '<p class="ovLead">A micro app laid out as a room. It answers one question for B2B marketers: are AI systems like ChatGPT, Claude, Gemini and Perplexity allowed to read what you post on LinkedIn, Reddit, YouTube, X, Instagram and Facebook?</p>' +
      '<dl class="kvs">' +
      '<div class="kv"><dt>Upstream: how it knows</dt><dd>It reads public sources: each platform\'s robots.txt, the AI companies\' lists of their own bots, what a logged-out visitor sees, platform owners\' AI policies and deal announcements. Machines and one person turn these into a green, amber or red light for each platform and AI system, and keep the evidence behind every light.</dd></div>' +
      '<div class="kv"><dt>Downstream: what you do with it</dt><dd>Plug in your content calendar. Every post meant to show up in AI answers is checked against its platform\'s status on the day it goes out, and the report flags posts headed where AI systems can\'t reach.</dd></div>' +
      '<div class="kv"><dt>Who it\'s for</dt><dd>Social and content teams at B2B companies, and agencies running social for clients.</dd></div>' +
      '<div class="kv"><dt>Why it\'s useful</dt><dd><ul class="why">' +
      '<li>One view instead of six platforms\' fine print.</li>' +
      '<li>Every light shows its source and the date it was checked.</li>' +
      '<li>Changes flash, so a platform closing its doors doesn\'t go unnoticed.</li>' +
      '<li>Mismatches show up before posts go out, not after.</li></ul></dd></div></dl>' +
      '<p class="limit"><b>Concept.</b> The lamp states here are sample data. Click any part to see what it does, or press Start under the room to follow one light from source to report.</p>';
    info.innerHTML = h;
  }
  function showInfo(id) {
    var p = byId[id], d = INFO[id];
    info.innerHTML = '<div class="cardtop"><span class="layerchip">' + esc(p.layer) + '</span><button type="button" class="backov" id="backOv">Back to overview</button></div><h3>' + esc(p.name) + '</h3><dl class="kvs">' +
      '<div class="kv"><dt>What it does</dt><dd>' + esc(d.does) + '</dd></div>' +
      '<div class="kv"><dt>Uses</dt><dd>' + esc(d.uses) + '</dd></div>' +
      '<div class="kv"><dt>Produces</dt><dd>' + esc(d.makes) + '</dd></div>' +
      '<div class="kv"><dt>Runs</dt><dd>' + esc(d.runs) + '</dd></div></dl>' +
      '<p class="limit"><b>Limit.</b> ' + esc(d.limit) + '</p>';
    document.getElementById('backOv').addEventListener('click', function () { stopTrace(); mark([], []); overview(); });
  }
  function mark(ids, pipes) {
    var set = {}; ids.forEach(function (i) { set[i] = true; });
    var pset = {}; (pipes || []).forEach(function (i) { pset[i] = true; });
    svg.classList.toggle('has-sel', ids.length > 0);
    svg.querySelectorAll('.part').forEach(function (g) { g.classList.toggle('sel', !!set[g.getAttribute('data-part')]); });
    svg.querySelectorAll('.tag').forEach(function (g) { g.classList.toggle('sel', !!set[g.getAttribute('data-tag')]); });
    svg.querySelectorAll('.pipe').forEach(function (g) { g.classList.toggle('active', !!pset[g.getAttribute('data-pipe')]); });
    plist.querySelectorAll('[data-pick]').forEach(function (b) { b.setAttribute('aria-pressed', set[b.getAttribute('data-pick')] ? 'true' : 'false'); });
    activePipes = pipes && pipes.length ? pipes : null;
    lastMark = { ids: ids.slice(), pipes: (pipes || []).slice() };
  }
  function select(id, zoom) {
    if (traceIdx >= 0) { stopTrace(); }
    mark([id], []);
    showInfo(id);
    if (zoom) { focusParts([id]); }
  }
  function clearSel() { if (traceIdx >= 0) { return; } mark([], []); overview(); }
  overview();
  syncControls();

  document.getElementById('tLabels').addEventListener('click', function () {
    var on = this.getAttribute('aria-pressed') !== 'true';
    this.setAttribute('aria-pressed', on ? 'true' : 'false');
    svg.classList.toggle('no-tags', !on);
  });

  /* ---------- trace ---------- */
  var traceIdx = -1;
  var stepNum = document.getElementById('stepNum'), stepText = document.getElementById('stepText');
  var prevB = document.getElementById('stepPrev'), nextB = document.getElementById('stepNext');
  function showStep(i) {
    traceIdx = i;
    var st = STEPS[i];
    mark(st.parts, st.pipes);
    showInfo(st.parts[st.parts.length - 1]);
    stepNum.textContent = (i + 1) + ' / ' + STEPS.length;
    stepText.textContent = st.text;
    prevB.disabled = i === 0;
    nextB.textContent = i === STEPS.length - 1 ? 'Finish' : 'Next';
    focusParts(st.parts);
  }
  function stopTrace() {
    if (traceIdx < 0) { return; }
    traceIdx = -1;
    stepNum.textContent = '0 / ' + STEPS.length;
    stepText.textContent = 'Follow LinkedIn\'s GPTBot light from its robots.txt file to the calendar report, one step at a time.';
    prevB.disabled = true; nextB.textContent = 'Start';
    mark([], []); overview();
  }
  nextB.addEventListener('click', function () {
    if (traceIdx === STEPS.length - 1) { stopTrace(); fitted = true; animateTo({ x: BASE.x, y: BASE.y, w: BASE.w, h: BASE.h }); return; }
    showStep(traceIdx + 1);
  });
  prevB.addEventListener('click', function () { if (traceIdx > 0) { showStep(traceIdx - 1); } });

  /* ---------- flow pulses ---------- */
  var activePipes = null, flowOn = !reduce, visible = true;
  var flowBtn = document.getElementById('tFlow');
  flowBtn.setAttribute('aria-pressed', flowOn ? 'true' : 'false');
  flowBtn.addEventListener('click', function () { flowOn = !flowOn; this.setAttribute('aria-pressed', flowOn ? 'true' : 'false'); if (!flowOn) { pulseG.innerHTML = ''; } });
  var pulseG = svg.querySelector('.pulses');
  var tracks = buildTracks();
  function buildTracks() { return PIPES.map(function (p) {
    var sp = p.pts.map(function (q) { return P(q[0], q[1], q[2]); });
    var segs = [], total = 0;
    for (var i = 1; i < sp.length; i++) { var L = Math.hypot(sp[i][0] - sp[i - 1][0], sp[i][1] - sp[i - 1][1]); segs.push({ a: sp[i - 1], b: sp[i], L: L }); total += L; }
    return { id: p.id, segs: segs, total: total };
  }); }
  function at(tr, d) {
    for (var i = 0; i < tr.segs.length; i++) { var s = tr.segs[i]; if (d <= s.L) { var k = d / s.L; return [s.a[0] + (s.b[0] - s.a[0]) * k, s.a[1] + (s.b[1] - s.a[1]) * k]; } d -= s.L; }
    var last = tr.segs[tr.segs.length - 1]; return last.b;
  }
  if ('IntersectionObserver' in window) { new IntersectionObserver(function (es) { visible = es[0].isIntersecting; }).observe(stage); }
  function frame(now) {
    if (flowOn && visible && !document.hidden) {
      var h = '';
      tracks.forEach(function (tr) {
        if (activePipes && activePipes.indexOf(tr.id) === -1) { return; }
        var gap = 46, speed = 0.035, n = Math.max(1, Math.floor(tr.total / gap));
        for (var k = 0; k < n; k++) {
          var d = ((now * speed) + k * (tr.total / n)) % tr.total;
          var q = at(tr, d);
          h += '<circle class="pulse" cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="' + (activePipes ? 3.2 : 2.4) + '"/>';
        }
      });
      pulseG.innerHTML = h;
    }
    requestAnimationFrame(frame);
  }
  if (!reduce) { requestAnimationFrame(frame); }

})();

</script>
